name: 'CI Build & Test'

on:
  pull_request:
    branches:
      - claude/nestworld-hybrid-arch-invq4h
      - nestworld-1.20.1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Check out a real local branch (actions/checkout leaves detached HEAD, which gradleutils' git-branch detection can't read)
        run: git checkout -B "${{ github.head_ref || github.ref_name }}"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3

      - name: Build and test
        run: ./gradlew build test --stacktrace
