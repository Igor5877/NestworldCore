modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# The consumer contract (docs/PACKAGING.md): a mandatory dependency on the provider mod gives a
# clean FML refusal when it is missing. The range must include -SNAPSHOT while the API is one.
[[dependencies.${mod_id}]]
    modId="nestworld_modapi"
    mandatory=true
    versionRange="[1.0.0-SNAPSHOT,2.0.0)"
    ordering="NONE"
    side="BOTH"
