    // PKG-002 (docs/contracts/PKG-002-distribution-model.md): :modapi's classes are NO LONGER
    // merged into this jar. Two copies of net.nestworld.modapi -- one inside the forge module, one
    // in any consumer -- were the split-package collision (API1B7-PKG-002). The API now reaches the
    // runtime only as the nestworld_modapi provider mod (modapiProviderJar below), which the
    // universal jar carries as jar-in-jar. Core still compiles against :modapi
    // (implementation project(':modapi')); at runtime it links to the provider module.

    // PKG-002 provider artifact (docs/contracts/PKG-002-distribution-model.md, commit N+1).
    // Step 1: remap :modapi's MCP-named classes to SRG with the same renamer, mappings and
    // libraries as reobfJar, plus this project's MCP-named jar as a library so the renamer sees
    // the patched-vanilla hierarchy (inherited members: ServerPlayer.getUUID -> Entity.m_20148_).
    def reobfModapiProvider = tasks.register('reobfModapiProvider', net.minecraftforge.gradle.patcher.tasks.ReobfuscateJar) {
        def base = tasks.named('reobfJar')
        dependsOn ':modapi:jar', tasks.named('jar')
        tool.set(base.flatMap { it.tool })
        args.set(base.flatMap { it.args })
        srg.set(base.flatMap { it.srg })
        libraries.from(base.map { it.libraries }, tasks.named('jar').flatMap { it.archiveFile })
        input.set(project(':modapi').tasks.named('jar').flatMap { it.archiveFile })
        output.set(layout.buildDirectory.file('modapiProvider/reobf-classes.jar'))
    }
    // Step 2: the provider mod jar = SRG classes + the generated mods.toml.
    def modapiProviderJar = tasks.register('modapiProviderJar', Jar) {
        dependsOn reobfModapiProvider, ':modapi:providerModsToml'
        archiveFileName = "nestworld-modapi-provider-${project(':modapi').version}.jar"
        destinationDirectory = layout.buildDirectory.dir('modapiProvider')
        from(zipTree(reobfModapiProvider.flatMap { it.output })) { include 'net/nestworld/modapi/**' }
        from(project(':modapi').providerTomlDir)
        manifest.attributes('Implementation-Title': 'nestworld_modapi',
                'Implementation-Version': project(':modapi').version)
        doLast {
            // Provider invariants: it is a mod (mods.toml), and its classes are SRG-named.
            def zip = new java.util.zip.ZipFile(archiveFile.get().asFile)
            try {
                if (zip.getEntry('META-INF/mods.toml') == null)
                    throw new GradleException("modapi provider: META-INF/mods.toml missing")
                ['net/nestworld/modapi/entity/ForgeVelocityExecution.class',
                 'net/nestworld/modapi/inventory/NestWorldInventory.class'].each { cls ->
                    def e = zip.getEntry(cls)
                    if (e == null) throw new GradleException("modapi provider: ${cls} missing")
                    def text = new String(zip.getInputStream(e).bytes, 'ISO-8859-1')
                    if (!text.contains('m_20148_') || text.contains('getUUID'))
                        throw new GradleException("modapi provider: ${cls} is not SRG-named (expected m_20148_)")
                }
            } finally {
                zip.close()
            }
        }
    }

    // jar-in-jar metadata for the built-in provider (the schema FML's JarInJarDependencyLocator
    // reads). The identifier is part of the distribution contract: consumers that carry the
    // provider as jar-in-jar (decision D2, form B) must use the same group/artifact so FML's jar
    // selection can unify the copies.
    def modapiJarJarMetadata = tasks.register('modapiJarJarMetadata') {
        def apiVersion = project(':modapi').version.toString()
        def out = layout.buildDirectory.file('modapiJarJar/META-INF/jarjar/metadata.json')
        inputs.property('apiVersion', apiVersion)
        outputs.file(out)
        doLast {
            out.get().asFile.parentFile.mkdirs()
            out.get().asFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([jars: [[
                identifier: [group: 'net.nestworld', artifact: 'nestworld-modapi-provider'],
                version: [range: "[${apiVersion},)".toString(), artifactVersion: apiVersion],
                path: "META-INF/jarjar/nestworld-modapi-provider-${apiVersion}.jar".toString(),
                isObfuscated: false
            ]]]))
        }
    }

    // SOURCE-PATCH-INTEGRITY-001 (docs/contracts/SOURCE-PATCH-INTEGRITY-001-spec.md). The committed
    // patches/ are the ONLY source of truth; projects/forge/src/main/java is a mutable, DERIVED
    // development representation of them. compileJava compiles that tree, and nothing in the normal
    // graph regenerates it, so a tree left behind by a `git pull` used to compile silently. Fail
    // closed: before compileJava, compare the tree with what the CURRENT generation inputs produce
    // (srg2mcp/output.zip = exactly what extractMapped would write; computed without touching the
    // tree) and fail with a three-way diagnosis on any mismatch. The build never regenerates the
    // tree itself: that would destroy uncommitted developer edits. Regeneration stays explicit
    // (setup / extractMapped), and is itself guarded against discarding edits.
    def spiPatchedSrc = file('src/main/java')
    def spiStateFile = file('.patch-state')            // projects/forge/.patch-state (ignored, survives `clean`)
    def spiPatchesDir = file("$rootDir/patches")
    def spiCanon = { java.security.MessageDigest root, String rel, byte[] content ->
        root.update(rel.getBytes('UTF-8')); root.update((byte) 0)
        root.update(java.security.MessageDigest.getInstance('SHA-256').digest(content)); root.update((byte) 0)
    }
    def spiDirDigest = { File dir ->
        def md = java.security.MessageDigest.getInstance('SHA-256')
        if (!dir.exists()) return 'absent'
        def files = []
        dir.eachFileRecurse(groovy.io.FileType.FILES) { files << it }
        files.collect { [dir.toPath().relativize(it.toPath()).toString().replace('\\', '/'), it] }
             .sort { it[0] }
             .each { spiCanon(md, it[0], it[1].bytes) }
        md.digest().encodeHex().toString() + ':' + files.size()
    }
    def spiZipDigest = { File zip ->
        def md = java.security.MessageDigest.getInstance('SHA-256')
        def zf = new java.util.zip.ZipFile(zip)
        try {
            def entries = zf.entries().toList().findAll { !it.directory }.sort { it.name }
            entries.each { e -> spiCanon(md, e.name, zf.getInputStream(e).bytes) }
            md.digest().encodeHex().toString() + ':' + entries.size()
        } finally { zf.close() }
    }
    def spiReadState = { ->
        if (!spiStateFile.exists()) return null
        def p = new Properties(); spiStateFile.withInputStream { p.load(it) }; p
    }
    def spiWriteState = { String generated, String tree ->
        def p = new Properties()
        p.setProperty('baseGeneratedDigest', generated); p.setProperty('baseTreeDigest', tree)
        spiStateFile.withOutputStream { p.store(it, 'SOURCE-PATCH-INTEGRITY-001 baseline: last known consistent state (tree == generation output)') }
    }
    def spiGitDirty = { ->
        def out = new ByteArrayOutputStream()
        project.exec { commandLine 'git', '-C', rootDir.absolutePath, 'status', '--porcelain'; standardOutput = out }
        !out.toString().trim().isEmpty()
    }

    def verifySourcePatchIntegrity = tasks.register('verifySourcePatchIntegrity') {
        group = 'verification'
        description = 'Fails the build unless the generated patched source tree equals what the committed patches generate.'
        dependsOn 'srg2mcp'
        outputs.upToDateWhen { false }
        doLast {
            File expectedZip = tasks.named('srg2mcp').get().output.get().asFile
            String generated = spiZipDigest(expectedZip)
            String tree = spiDirDigest(spiPatchedSrc)
            String patchSet = spiDirDigest(spiPatchesDir)
            project.ext.spiProvenance = [
                    'Git-Commit'             : gradleutils.gitInfo.abbreviatedId,
                    'Git-Dirty'              : String.valueOf(spiGitDirty()),
                    'Patch-Set-Digest'       : patchSet,
                    'Generated-Source-Digest': tree,
                    'Source-Patch-Integrity' : 'MATCH']
            if (tree == generated) {
                spiWriteState(generated, tree)
                logger.lifecycle("SOURCE-PATCH-INTEGRITY: MATCH (generated source == committed patch inputs, ${tree})")
                return
            }
            def base = spiReadState()
            String state, action
            if (base == null) {
                state = 'UNKNOWN_BASELINE'
                action = 'No record of the last consistent state, so the direction cannot be determined. If the tree holds no ' +
                         'local work, regenerate it explicitly (./gradlew :forge:extractMapped -PforceRegeneratePatchedSources=true); ' +
                         'otherwise run :forge:genPatches and reconcile first.'
            } else {
                boolean genChanged = base.getProperty('baseGeneratedDigest') != generated
                boolean treeChanged = base.getProperty('baseTreeDigest') != tree
                if (genChanged && !treeChanged) {
                    state = 'PATCHES_AHEAD'
                    action = 'Generated source is stale relative to the committed patches (e.g. after git pull). ' +
                             'Regenerate patched sources: ./gradlew :forge:extractMapped'
                } else if (!genChanged && treeChanged) {
                    state = 'TREE_AHEAD'
                    action = 'Generated source contains changes not represented by patches. ' +
                             'Run ./gradlew :forge:genPatches, keep only the intended patch changes, and rebuild.'
                } else if (genChanged && treeChanged) {
                    state = 'DIVERGED'
                    action = 'Both the patches and the generated source changed independently. Manual reconciliation required: ' +
                             'save your tree edits (genPatches into a scratch branch), regenerate, then reapply.'
                } else {
                    state = 'INCONSISTENT_BASELINE'
                    action = 'Baseline claims consistency but tree != generation output; delete projects/forge/.patch-state only ' +
                             'after checking the tree, then regenerate or genPatches.'
                }
            }
            // Reconciliation path: genPatches compiles the tree (applyRangeMapBase -> extractRangeMap), so it
            // would be blocked by the very state it exists to resolve. TREE_AHEAD -- and only TREE_AHEAD -- is
            // tolerated when genPatches is in this build AND no task that produces a patched artifact is.
            // PATCHES_AHEAD / DIVERGED still fail: genPatches from a stale tree would silently revert committed
            // patch content (the mechanism of the 2026-09-23 incident).
            def graph = gradle.taskGraph
            // (:forge:jar is NOT listed: it is the intermediate MCP-named jar, part of genPatches' own graph via
            // validateDeprecations; everything shipped is derived through reobfJar, which IS listed.)
            def artifactTasks = [':forge:reobfJar', ':forge:universalJar', ':forge:signUniversalJar',
                                 ':forge:installerJar', ':forge:genServerBinPatches', ':forge:genClientBinPatches']
            def artifactsInGraph = artifactTasks.findAll { graph.hasTask(it) }
            if (state == 'TREE_AHEAD' && graph.hasTask(':forge:genPatches') && artifactsInGraph.isEmpty()) {
                logger.lifecycle("SOURCE-PATCH-INTEGRITY: TREE_AHEAD tolerated for :forge:genPatches (reconciliation); no artifact task in this build")
                project.ext.spiProvenance['Source-Patch-Integrity'] = 'TREE_AHEAD_RECONCILIATION'
                return
            }
            if (state == 'TREE_AHEAD' && graph.hasTask(':forge:genPatches')) {
                action = 'genPatches may not run in the same build as artifact tasks ' + artifactsInGraph + '. Run :forge:genPatches alone first.'
            }
            throw new GradleException("SOURCE-PATCH-INTEGRITY-001 ${state}: projects/forge/src/main/java does not match the committed patch inputs.\n" +
                    "  generation output: ${generated}\n  generated tree:    ${tree}\n  baseline:          ${base == null ? 'none' : base.getProperty('baseGeneratedDigest') + ' / ' + base.getProperty('baseTreeDigest')}\n" +
                    "  ${action}")
        }
    }
    // [4]/[14]: every production patched artifact (jar -> reobfJar -> binpatches -> universal/installer)
    // is derived from compileJava's output, so this single edge gates all of them.
    tasks.named('compileJava') { dependsOn verifySourcePatchIntegrity }

    // [3]: the explicit regeneration must not destroy uncommitted tree edits either.
    tasks.named('extractMapped') {
        doFirst {
            // A fresh checkout has NO tree, or an EMPTY directory (ForgeGradle creates it at configuration
            // time): nothing to lose, regeneration is always allowed.
            boolean treeHasFiles = spiPatchedSrc.exists() && spiPatchedSrc.listFiles()?.any { it.isDirectory() || it.isFile() }
            if (!treeHasFiles || project.findProperty('forceRegeneratePatchedSources') == 'true') return
            def base = spiReadState()
            String tree = spiDirDigest(spiPatchedSrc)
            if (base == null || base.getProperty('baseTreeDigest') != tree) {
                throw new GradleException('SOURCE-PATCH-INTEGRITY-001: refusing to overwrite projects/forge/src/main/java: ' +
                        (base == null ? 'no baseline exists' : 'it has edits since the last consistent state') +
                        '. Run :forge:genPatches to keep them, or pass -PforceRegeneratePatchedSources=true to discard them.')
            }
        }
    }

    // PKG-002 Gate 2 (S5): the provider SPI ABI this Core build was compiled against, GENERATED from
    // Core's own bytecode -- every reference from Core (net/nestworld/** in this project) to a
    // net/nestworld/modapi/** member, plus every modapi interface a Core class implements and the
    // methods it implements. ModApiAbiGate verifies exactly this list against the selected provider
    // at startup. No hand-maintained second source of truth. Reobf does not change these entries:
    // modapi member names are not obfuscated, and descriptors carry class names only, which are the
    // same (Mojang-named) at runtime.
    def spiAbiManifest = tasks.register('spiAbiManifest') {
        def asmCfg = project.configurations.detachedConfiguration(
                project.dependencies.create('org.ow2.asm:asm:9.3'),
                project.dependencies.create('org.ow2.asm:asm-tree:9.3'))
        def classesDirs = sourceSets.main.output.classesDirs
        def apiClassesDirs = project(':modapi').sourceSets.main.output.classesDirs
        def out = layout.buildDirectory.file('spiAbi/META-INF/nestworld/spi-abi.json')
        def apiVersion = project(':modapi').version.toString()
        dependsOn tasks.named('compileJava'), ':modapi:classes'
        inputs.files(classesDirs)
        inputs.files(apiClassesDirs)
        inputs.property('apiVersion', apiVersion)
        outputs.file(out)
        doLast {
            def cl = new URLClassLoader(asmCfg.files.collect { it.toURI().toURL() } as URL[], getClass().classLoader)
            def ClassReader = cl.loadClass('org.objectweb.asm.ClassReader')
            def ClassNode = cl.loadClass('org.objectweb.asm.tree.ClassNode')
            def Type = cl.loadClass('org.objectweb.asm.Type')
            final String API = 'net/nestworld/modapi/'
            def classes = new TreeSet<String>()
            def members = new TreeMap<String, Map>()     // key -> entry, deduplicated
            def implementsList = []
            def noteType = { String internalOrDesc ->
                if (internalOrDesc == null) return
                def t = internalOrDesc.startsWith('(') ? null : (internalOrDesc.startsWith('[') || internalOrDesc.endsWith(';') || internalOrDesc.length() == 1
                        ? Type.getType(internalOrDesc) : Type.getObjectType(internalOrDesc))
                def collect = { tt ->
                    while (tt.sort == 9 /* ARRAY */) tt = tt.elementType
                    if (tt.sort == 10 /* OBJECT */ && tt.internalName.startsWith(API)) classes << tt.internalName
                }
                if (internalOrDesc.startsWith('(')) {
                    def mt = Type.getMethodType(internalOrDesc)
                    mt.argumentTypes.each { collect(it) }
                    collect(mt.returnType)
                } else if (t != null) collect(t)
            }
            int scanned = 0
            classesDirs.each { dir ->
                if (!dir.exists()) return
                dir.eachFileRecurse { f ->
                    if (!f.name.endsWith('.class')) return
                    def rel = dir.toPath().relativize(f.toPath()).toString().replace('\\', '/')
                    if (!rel.startsWith('net/nestworld/') || rel.startsWith(API)) return
                    scanned++
                    def node = ClassNode.getDeclaredConstructor().newInstance()
                    ClassReader.getConstructor(byte[]).newInstance([f.bytes] as Object[]).accept(node, 0)
                    def apiIfaces = (node.interfaces ?: []).findAll { it.startsWith(API) }
                    if (node.superName?.startsWith(API)) apiIfaces << node.superName
                    apiIfaces.each { iface ->
                        classes << iface
                        // An implemented SPI type is a TWO-WAY contract: Core must implement every
                        // abstract method the provider declares (checked at runtime against
                        // "implemented"), AND the provider must still declare -- and therefore call --
                        // every method Core implements for it ("contract", read from the :modapi
                        // classes this Core was compiled against). Gate run 1 missed S5 itself
                        // (InventorySetBackend.setSlot removed) without the second half.
                        def apiFile = apiClassesDirs.collect { new File(it, iface + '.class') }.find { it.exists() }
                        if (apiFile == null) throw new GradleException("spiAbiManifest: ${iface}.class not found in :modapi classes")
                        def apiNode = ClassNode.getDeclaredConstructor().newInstance()
                        ClassReader.getConstructor(byte[]).newInstance([apiFile.bytes] as Object[]).accept(apiNode, 0)
                        implementsList << [coreClass: node.name, type: iface,
                                           implemented: node.methods.collect { it.name + it.desc }.sort(),
                                           contract: apiNode.methods.findAll { (it.access & 0x0400) != 0 }.collect { it.name + it.desc }.sort()]
                    }
                    node.fields.each { noteType(it.desc) }
                    node.methods.each { m ->
                        noteType(m.desc)
                        m.instructions.each { insn ->
                            def cn = insn.getClass().simpleName
                            if (cn == 'MethodInsnNode' && insn.owner.startsWith(API)) {
                                noteType(insn.owner); noteType(insn.desc)
                                members["M ${insn.owner}.${insn.name}${insn.desc} ${insn.opcode}"] =
                                        [kind: 'method', owner: insn.owner, name: insn.name, desc: insn.desc, opcode: insn.opcode, itf: insn.itf]
                            } else if (cn == 'FieldInsnNode' && insn.owner.startsWith(API)) {
                                noteType(insn.owner); noteType(insn.desc)
                                members["F ${insn.owner}.${insn.name}:${insn.desc} ${insn.opcode}"] =
                                        [kind: 'field', owner: insn.owner, name: insn.name, desc: insn.desc, opcode: insn.opcode]
                            } else if (cn == 'TypeInsnNode') {
                                noteType(insn.desc)
                            } else if (cn == 'LdcInsnNode' && insn.cst?.getClass()?.name == 'org.objectweb.asm.Type') {
                                noteType(insn.cst.descriptor)
                            } else if (cn == 'InvokeDynamicInsnNode') {
                                noteType(insn.desc)
                                (insn.bsmArgs ?: []).each { a ->
                                    if (a?.getClass()?.simpleName == 'Handle' && a.owner.startsWith(API)) {
                                        noteType(a.owner); noteType(a.desc)
                                        int tag = a.tag
                                        int opcode = tag == 6 ? 184 : tag == 8 ? 183 : tag == 9 ? 185 : 182 // H_INVOKESTATIC/NEWINVOKESPECIAL/INTERFACE/else virtual
                                        members["M ${a.owner}.${a.name}${a.desc} ${opcode}"] =
                                                [kind: 'method', owner: a.owner, name: a.name, desc: a.desc, opcode: opcode, itf: a.isInterface()]
                                    }
                                }
                            }
                        }
                    }
                }
            }
            if (scanned == 0) throw new GradleException('spiAbiManifest: scanned no Core classes -- wrong classes dir?')
            if (members.isEmpty()) throw new GradleException('spiAbiManifest: Core references no net/nestworld/modapi members -- scan is broken')
            out.get().asFile.parentFile.mkdirs()
            out.get().asFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
                    builtAgainstModApi: apiVersion,
                    coreClassesScanned: scanned,
                    classes           : classes.toList(),
                    members           : members.values().toList(),
                    implementsTypes   : implementsList.sort { it.coreClass + it.type }
            ]))
            logger.lifecycle("spiAbiManifest: ${scanned} Core classes, ${classes.size()} API classes, ${members.size()} members, ${implementsList.size()} implements")
        }
    }

    universalJar {
        from extraTxts

        // add crowdin locales
        from zipTree(downloadCrowdin.dest).matching {
            include 'assets/forge/lang/*.json'
        }

        // PKG-002: the Mod API ships as the nestworld_modapi provider mod, jar-in-jar. FML
        // extracts it (proven, E6) and deduplicates it against a provider a server owner or a
        // consumer mod also brings (newest wins, E3/E6b); Core's mods.toml dependency range then
        // accepts or rejects the selected version before any Core class loads (decision D1).
        dependsOn modapiProviderJar, modapiJarJarMetadata
        dependsOn spiAbiManifest
        from(spiAbiManifest.map { layout.buildDirectory.dir('spiAbi') }) // PKG-002 Gate 2 (S5): read by ModApiAbiGate
        from(modapiProviderJar) { into 'META-INF/jarjar' }
        from(modapiJarJarMetadata.map { layout.buildDirectory.dir('modapiJarJar') })

        dependsOn downloadCrowdin
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE

        dependsOn verifySourcePatchIntegrity
        doFirst {
            MANIFESTS.each{ pkg, values ->
                if (pkg == '/') {
                    manifest.attributes(values)
                } else {
                    manifest.attributes(values, pkg)
                }
            }
            // SOURCE-PATCH-INTEGRITY-001 [10]: provenance of the source state this artifact was built from.
            // Git-Dirty=true means: NOT reproducible from Git-Commit alone.
            manifest.attributes(project.ext.spiProvenance)
        }

        // Packaging invariants (PKG-001, PKG-002). Each of these failed silently at least once
        // before it was checked: classes absent (NoClassDefFoundError at boot), classes present but
        // MCP-named (NoSuchMethodError at first call), classes duplicated across modules (server
        // refuses to start when a consumer brings its own copy).
        doLast {
            def jarPath = archiveFile.get().asFile
            def zip = new java.util.zip.ZipFile(jarPath)
            def apiVersion = project(':modapi').version.toString()
            def nested = "META-INF/jarjar/nestworld-modapi-provider-${apiVersion}.jar"
            def fail = { String why -> throw new GradleException("universalJar packaging invariant violated: ${why}") }
            try {
                // 1. The forge module itself contains NO Mod API classes (PKG-002).
                def leaked = zip.entries().toList().findAll { it.name.startsWith('net/nestworld/modapi/') && it.name.endsWith('.class') }
                if (!leaked.isEmpty()) {
                    fail("${leaked.size()} net/nestworld/modapi classes inside the forge module (first: ${leaked[0].name}); the API must ship only as the jar-in-jar provider")
                }
                // 2. The provider is present as jar-in-jar, and metadata.json points at it.
                def entry = zip.getEntry(nested)
                if (entry == null) fail("${nested} missing")
                def meta = zip.getEntry('META-INF/jarjar/metadata.json')
                if (meta == null) fail('META-INF/jarjar/metadata.json missing')
                def metaJson = new groovy.json.JsonSlurper().parse(zip.getInputStream(meta))
                if (!metaJson.jars.any { it.path == nested }) fail("metadata.json does not reference ${nested}")
                // 3. The nested provider is a mod with the expected id and version, and SRG-named.
                def tmp = File.createTempFile('nested-provider', '.jar')
                tmp.deleteOnExit()
                tmp.bytes = zip.getInputStream(entry).bytes
                def inner = new java.util.zip.ZipFile(tmp)
                try {
                    def toml = inner.getEntry('META-INF/mods.toml')
                    if (toml == null) fail('nested provider has no META-INF/mods.toml')
                    def tomlText = inner.getInputStream(toml).text
                    if (!tomlText.contains('modId="nestworld_modapi"') || !tomlText.contains('version="' + apiVersion + '"')) {
                        fail("nested provider mods.toml does not declare nestworld_modapi ${apiVersion}")
                    }
                    ['net/nestworld/modapi/entity/ForgeVelocityExecution.class',
                     'net/nestworld/modapi/inventory/NestWorldInventory.class'].each { cls ->
                        def e = inner.getEntry(cls)
                        if (e == null) fail("nested provider lacks ${cls}")
                        def text = new String(inner.getInputStream(e).bytes, 'ISO-8859-1')
                        if (!text.contains('m_20148_') || text.contains('getUUID')) fail("nested provider ${cls} is not SRG-named (expected m_20148_)")
                    }
                } finally {
                    inner.close()
                }
                // 5. Gate 2's generated ABI manifest is present and non-trivial (S5).
                def abi = zip.getEntry('META-INF/nestworld/spi-abi.json')
                if (abi == null) fail('META-INF/nestworld/spi-abi.json (Mod API ABI gate manifest) missing')
                def abiJson = new groovy.json.JsonSlurper().parse(zip.getInputStream(abi))
                if (!abiJson.members || abiJson.builtAgainstModApi != apiVersion) fail("spi-abi.json empty or built against ${abiJson.builtAgainstModApi}, not ${apiVersion}")
                // 4. Core's declared Mod API range (its own mods.toml, decision D1) accepts the
                //    built-in provider -- never ship a NestWorld that rejects its own API.
                def coreText = zip.getInputStream(zip.getEntry('META-INF/mods.toml')).text
                def m = (coreText =~ /(?s)\[\[dependencies\.nestworld\]\]\s*modId="nestworld_modapi".*?versionRange="([^"]+)"/)
                if (!m.find()) fail('Core mods.toml declares no nestworld_modapi dependency range')
                def range = org.apache.maven.artifact.versioning.VersionRange.createFromVersionSpec(m.group(1))
                if (!range.containsVersion(new org.apache.maven.artifact.versioning.DefaultArtifactVersion(apiVersion))) {
                    fail("Core's supported Mod API range ${m.group(1)} rejects the built-in provider ${apiVersion}; widen it only after compatibility verification (D1)")
                }
            } finally {
                zip.close()
            }
        }
    }

    task installerJar(type: InstallerJar, dependsOn: [genClientBinPatches, genServerBinPatches, 'signUniversalJar', launcherJson]) {
        packedDependencies = PACKED_DEPS
        from(extraTxts)
        from(rootProject.file('/forge_installer_logo.png')) {
            rename { 'big_logo.png' }
        }
        from(genClientBinPatches.output) {
            rename { 'data/client.lzma' }
        }
        from(genServerBinPatches.output) {
            rename { 'data/server.lzma' }
        }
    }

    task makeMdk(type: Zip) {
        archiveBaseName = project.name
        archiveClassifier = 'mdk'
        archiveVersion = project.version
        destinationDirectory = file('build/libs')

        from rootProject.file('gradlew')
        from rootProject.file('gradlew.bat')
        from extraTxts
        from(rootProject.file('gradle/')){
            into('gradle/')
        }
        from(rootProject.file('mdk/')){
            rootProject.file('mdk/gitignore.txt').eachLine{
                if (!it.trim().isEmpty() && !it.trim().startsWith('#'))
                    exclude it
            }
            filter(ReplaceTokens, tokens: [
                FORGE_VERSION: FORGE_VERSION,
                FORGE_GROUP: project.group,
                FORGE_NAME: project.name,
                MC_VERSION: MC_VERSION,
                MAPPING_CHANNEL: MAPPING_CHANNEL,
                MAPPING_VERSION: MAPPING_VERSION,
                FORGE_SPEC_VERSION: SPEC_VERSION.split("\\.")[0],
                MC_NEXT_VERSION: MC_NEXT_VERSION
            ])
            rename 'gitignore\\.txt', '.gitignore'
            rename 'gitattributes\\.txt', '.gitattributes'
        }
        from(rootProject.file('src/generated_mdk/resources/')) {
            into('src/main/resources/')
            exclude '**/.cache/'
        }
    }

    license {
        header = file("$rootDir/LICENSE-header.txt")

        include 'net/minecraftforge/'
        exclude 'net/minecraftforge/common/LenientUnboundedMapCodec.java'

        tasks {
            main {
                files.from files("$rootDir/src/main/java")
            }
            test {
                files.from files("$rootDir/src/test/java")
            }
        }
    }

    tasks.register('genAllData') {
        dependsOn 'forge_data', 'forge_mdk_data', 'forge_test_data'
    }

    tasks.eclipse.dependsOn('genEclipseRuns')

    if (project.hasProperty('UPDATE_MAPPINGS')) {
        extractRangeMap {
            sources.from sourceSets.test.java.srcDirs
            addDependencies compileTestJava.classpath
        }
        applyRangeMap {
            sources.from sourceSets.test.java.srcDirs
        }
        sourceSets.test.java.srcDirs.each { extractMappedNew.addTarget it }
    }

    tasks.named('javadoc', Javadoc).configure {
        description 'Generates the combined javadocs for the FML projects and the main Forge project'
        var includedProjects = [ ':fmlcore', ':fmlloader', ':javafmllanguage', ':mclanguage' ]
        source includedProjects.collect { project(it).sourceSets.main.allJava }
        classpath = classpath + files(includedProjects.collect { project(it).sourceSets.main.compileClasspath })

        var docsDir = rootProject.file('src/docs/')
        inputs.dir(docsDir)
            .withPropertyName('docs resources directory')
            .withPathSensitivity(PathSensitivity.RELATIVE)
            .optional()

        failOnError = false

        // Exclude the Minecraft classes if not enabled
        if (!project.hasProperty('generateAllDocumentation')) {
            exclude 'net/minecraft/**'
            exclude 'com/mojang/**'
        }
        exclude 'mcp/**'

        options.addStringOption('Xdoclint:all,-missing', '-public')
        options {
            stylesheetFile = new File(docsDir, 'stylesheet.css')

            tags = [
                'apiNote:a:<em>API Note:</em>',
                'implSpec:a:<em>Implementation Requirements:</em>',
                'implNote:a:<em>Implementation Note:</em>'
            ]

            groups = [
                'Forge Mod Loader': [
                    'net.minecraftforge.fml.common.asm*',
                    'net.minecraftforge.fml.loading*',
                    'net.minecraftforge.fml.server*'
                ],
                'FML Core':  [
                    'net.minecraftforge.fml',
                    'net.minecraftforge.fml.config*',
                    'net.minecraftforge.fml.event*',
                    'net.minecraftforge.fml.util*'
                ],
                'FML Common': [
                    'net.minecraftforge.fml.core',
                    'net.minecraftforge.fml.event.config',
                    'net.minecraftforge.fml.event.lifecycle'
                ],
                'FML Java/MC Language Providers': [
                    'net.minecraftforge.fml.common',
                    'net.minecraftforge.fml.javafmlmod',
                    'net.minecraftforge.fml.mclanguageprovider'
                ],
                'Minecraft Forge API': [
                    'net.minecraftforge*'
                ]
            ]

            author = false
            noSince = true
            noHelp = true

            bottom = "Minecraft Forge is an open source modding API for Minecraft: Java Edition, licensed under the Lesser GNU General Public License, version 2.1."
            windowTitle = "Minecraft Forge API ${VERSION}"
            docTitle = "Minecraft Forge API - ${FORGE_VERSION} for Minecraft ${MC_VERSION}"
            header = "<div style=\"margin-top: 9px;padding: 5px 6px;\"><strong>${FORGE_VERSION} for Minecraft ${MC_VERSION}</strong></div>"
        }

        doLast {
            project.copy {
                from docsDir
                exclude '/stylesheet.css'
                into destinationDir
            }
        }
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifact universalJar
                artifact installerJar
                //TODO: installer-win
                artifact makeMdk
                artifact userdevJar
                artifact sourcesJar
            }
        }
    }
    // Since we need the modules in the bootstrap, we need to make sure they are compiled before we do each run
    afterEvaluate { prepareRuns.dependsOn(PACKED_DEPS) }
    
    // Make sure we run bin compat checking during local testing.
    if (!System.env.MAVEN_USER || !System.env.MAVEN_PASSWORD)
        publish.dependsOn(':forge:checkJarCompatibility')
}

// API-PKG-1 (packaging gate): net.nestworld.modapi.entity as a standalone, Maven-consumable,
// Core-free artifact. compileOnly against :clean (genuine unpatched-by-NestWorld Forge/vanilla)
// -- NOT :forge (which bundles NestWorld's own patches + net.nestworld.region.* in one
// monolithic sourceSet; FORGE-001 already found deep, un-strippable Core coupling baked into
// patched vanilla's own bootstrap, so compiling against :forge here would silently reintroduce
// exactly the coupling this module exists to prove absent). :clean is also what :forge itself
// depends on via patcher{parent=...}, so this creates a valid DAG: :modapi -> :clean <- :forge,
// :forge -> :modapi. No cycle.
project(':modapi') {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'

    group = 'net.nestworld'
    version = '1.0.0-SNAPSHOT'

    java {
        withSourcesJar()
    }

    dependencies {
        compileOnly project(':clean')
        compileOnly 'org.slf4j:slf4j-api:2.0.9'
    }

    // PKG-002 (docs/contracts/PKG-002-distribution-model.md): the Mod API is distributed at
    // runtime as an FML mod, modId "nestworld_modapi" -- never as classes merged into another
    // module (that was the split-package collision itself). This only generates its mods.toml;
    // the SRG-reobfuscated provider jar is assembled in :forge (reobfModapiProvider /
    // modapiProviderJar), because remapping inherited vanilla members needs the patched-vanilla
    // class hierarchy that only :forge has.
    def providerToml = tasks.register('providerModsToml') {
        def out = layout.buildDirectory.file('provider/META-INF/mods.toml')
        inputs.property('version', project.version)
        outputs.file(out)
        doLast {
            out.get().asFile.parentFile.mkdirs()
            out.get().asFile.text = [
                'modLoader="lowcodefml"',
                'loaderVersion="[47,)"',
                'license="All Rights Reserved"',
                '[[mods]]',
                'modId="nestworld_modapi"',
                "version=\"${project.version}\"",
                'displayName="NestWorld Mod API"',
                'description="Runtime provider of the NestWorld Mod API (net.nestworld.modapi). Install on stock Forge or carry it as jar-in-jar; NestWorld ships it built in."',
                ''
            ].join('\n')
        }
    }
    ext.providerTomlDir = layout.buildDirectory.dir('provider')
    // The same mods.toml in :modapi's own resources: on a dev classpath (ForgeGradle runs of Core or
    // of a consumer using fg.deobf) :modapi is then itself the nestworld_modapi mod, so the
    // mandatory dependencies resolve there too. The provider jar takes classes only from the
    // reobfuscated output and adds this file once.
    tasks.named('processResources', ProcessResources) {
        dependsOn providerToml
        from(providerTomlDir)
    }

    publishing {
        publications {
            // COMPILE-TIME API (MCP names, for ForgeGradle consumers): compileOnly only. Its jar
            // also carries the nestworld_modapi mods.toml, so on a dev classpath it acts as the mod.
            modapi(MavenPublication) {
                from components.java
                groupId = 'net.nestworld'
                artifactId = 'nestworld-mod-api-forge-1.20.1'
                version = '1.0.0-SNAPSHOT'
            }
            // RUNTIME PROVIDER (SRG names, the FML mod nestworld_modapi): install on stock Forge, or
            // carry it as jar-in-jar (PKG-002 decision D2, form B). NestWorld ships the same artifact
            // built in. group/artifact are the jar-in-jar identifier FML unifies copies by -- part of
            // the distribution contract. Never a compile dependency (it is SRG-named).
            modapiProvider(MavenPublication) {
                groupId = 'net.nestworld'
                artifactId = 'nestworld-modapi-provider'
                version = project.version.toString()
                artifact(project(':forge').tasks.named('modapiProviderJar'))
                pom {
                    name = 'NestWorld Mod API provider (FML mod nestworld_modapi)'
                    description = 'Runtime provider of net.nestworld.modapi; consumers compile against nestworld-mod-api-forge-1.20.1'
                }
            }
        }
        repositories {
            mavenLocal()
        }
    }
}

//evaluationDependsOnChildren()
task setup() {  //These must be strings so that we can do lazy resolution. Else we need evaluationDependsOnChildren above
    if (!System.env.TEAMCITY_VERSION)
        dependsOn ':clean:extractMapped'
    if (symlinkValid)
        dependsOn ':fmlonly:extractMapped'
    dependsOn ':forge:extractMapped'
}

task doChecks {
    dependsOn ':forge:checkJarCompatibility'
    dependsOn ':forge:publish'
}

if (symlinkValid)
    project.gradle.startParameter.excludedTaskNames.add(':fmlonly:genPatches')

if (!System.env.TEAMCITY_VERSION)
    project.gradle.startParameter.excludedTaskNames.add(':clean:genPatches')

//Also output FMLOnly when building a version.
if (System.env.TEAMCITY_VERSION) {
    //Only setup the CI environment if and only if the environment variables are set.
    tasks.configureTeamCity {
        doLast {
            println "##teamcity[buildNumber '${project(':forge').version}']"
            println "##teamcity[setParameter name='env.PUBLISHED_JAVA_ARTIFACT_VERSION' value='${project(':forge').version}']"
            println "##teamcity[setParameter name='env.PUBLISHED_JAVA_FML_ARTIFACT_VERSION' value='${project(':fmlonly').version}']"
        }
    }
}

